<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contato</title>
    <link rel="stylesheet" href="../css/style.css">
</head>
<body>
   
    
    <!-- HEADER: Estrutura principal do topo -->
    <header>
        <!-- DIV: Único elemento da página que recebe a classe para estilização/layout -->
        <div class="header-container">
            <nav>
                <ul>
                    <li>
                        <a href="../index.html">Início</a>
                    </li>
                    <li>
                        <!-- Caminho para o arquivo na pasta html/ -->
                        <a href="./sobre.html">Sobre Nós</a>
                    </li>
                    <li>
                        <!-- Caminho para o arquivo na pasta html/ -->
                        <a href="./contato.html">Contato</a>
                    </li>
                </ul>
            </nav>
        </div>
    </header>

    <!-- MAIN: Conteúdo principal da página -->
   <!-- MAIN: Conteúdo principal da página -->
    <main>
        <form action="#">
            <div class="cartao">

                <div class="titulo">
                    <h2>Cadastro</h2>
                </div>
                <div class="campo">
                    <label for="nome">Digite seu nome:</label>
                    <input type="text" name="nome" placeholder="Digite seu nome" required>
                </div>

                <div class="campo">
                    <label for="cpf">Digite seu CPF:</label>
                    <input type="text" name="cpf" placeholder="Digite seu CPF" required>
                </div>
                <div class="campo">
                    <label for="endereco">Digite seu endereço:</label>
                    <input type="text" name="endereco" required>
                </div>
                <div class="campo">
                    <label for="tel">Digite seu telefone:</label>
                    <input type="tel" name="tel" required>
                </div>

                <div class="campo">
                    <label for="email">Digite seu email:</label>
                    <input type="email" name="email" required>
                </div>

                <div class="campo">
                    <label for="datanascimento">Data de nascimento:</label>
                    <input type="date" name="datanascimento">
                </div>

                <div class="campo">
                    <label for="senha">Digite sua senha:</label>
                    <input type="password" name="senha" required>
                </div>
                <div class="campo">
                    <label for="senha">Confirme a sua senha:</label>
                    <input type="password" name="senha" required>
                </div>

                <div class="button">
                    <button type="submit" class="btn btn-submit">Cadastrar</button>
                </div>

            </div>

        </form>


    </main>

    <!-- FOOTER: Rodapé da página -->
    <footer>
        <!-- DIV: Usada para organizar/centralizar as informações do rodapé -->
        <div class="footer-container">
            <p>&copy; 2026 Barbearia - Todos os direitos reservados.</p>
        </div>
    </footer>

</body>
</html>
